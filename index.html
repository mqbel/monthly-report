<!doctype html>
<html lang="ar" dir="rtl" data-theme="day">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>التقرير الشهري — ون</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;800&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
/* ═══════════ Themes ═══════════ */
:root,[data-theme=night]{
  color-scheme:dark;
  --bg0:#010d14;--bg1:#03192a;--bg2:#062638;
  --panel:rgba(6,38,56,.62);--panel2:rgba(10,50,72,.55);--solid:#052233;
  --line:rgba(247,142,32,.20);--line2:rgba(145,182,187,.16);
  --ink:#eaf3f5;--muted:#9db7c0;--soft:#6c8a95;
  --a1:#F78E20;--a2:#F15A3E;--a3:#C2203D;--a4:#5E1042;
  --ok:#3fdc97;--warn:#F78E20;--bad:#ff4d6d;
  --grid:rgba(247,142,32,.05);--glowc:247,142,32;
  --grad:linear-gradient(90deg,#5E1042,#C2203D,#F15A3E,#F78E20);
  --logo-ink:#ffffff;
}
[data-theme=cyber]{
  color-scheme:dark;
  --bg0:#04060d;--bg1:#07101e;--bg2:#0c1830;
  --panel:rgba(13,27,53,.62);--panel2:rgba(18,35,72,.55);--solid:#0a1733;
  --line:rgba(0,229,255,.20);--line2:rgba(0,229,255,.12);
  --ink:#d8eaff;--muted:#8aa6cc;--soft:#56709a;
  --a1:#00e5ff;--a2:#6f6bff;--a3:#ff5af0;--a4:#2b3a8f;
  --ok:#0fffa3;--warn:#ffb13b;--bad:#ff4d6d;
  --grid:rgba(0,229,255,.06);--glowc:0,229,255;
  --grad:linear-gradient(90deg,#6f6bff,#00e5ff);
  --logo-ink:#ffffff;
}
[data-theme=plum]{
  color-scheme:dark;
  --bg0:#12040d;--bg1:#1d0816;--bg2:#2a0d21;
  --panel:rgba(48,14,38,.6);--panel2:rgba(66,20,52,.55);--solid:#2a0d21;
  --line:rgba(241,90,62,.24);--line2:rgba(241,90,62,.14);
  --ink:#fbeaf1;--muted:#d4a9bd;--soft:#9a6f84;
  --a1:#F15A3E;--a2:#F78E20;--a3:#ff7aa8;--a4:#5E1042;
  --ok:#5fe0a6;--warn:#F78E20;--bad:#ff5c7a;
  --grid:rgba(241,90,62,.05);--glowc:241,90,62;
  --grad:linear-gradient(90deg,#C2203D,#F15A3E,#F78E20);
  --logo-ink:#ffffff;
}
[data-theme=day]{
  color-scheme:light;
  --bg0:#eef4f6;--bg1:#f6f9fa;--bg2:#ffffff;
  --panel:rgba(255,255,255,.92);--panel2:#f3f7f8;--solid:#ffffff;
  --line:rgba(2,37,55,.13);--line2:rgba(2,37,55,.09);
  --ink:#062330;--muted:#5f7c88;--soft:#8aa0aa;
  --a1:#F78E20;--a2:#F15A3E;--a3:#C2203D;--a4:#5E1042;
  --ok:#2fa874;--warn:#e57a12;--bad:#C2203D;
  --grid:rgba(2,37,55,.04);--glowc:241,90,62;
  --grad:linear-gradient(90deg,#5E1042,#C2203D,#F15A3E,#F78E20);
  --logo-ink:#022537;
}
.logo .cls-8{fill:var(--logo-ink)!important}
body.viewer .owner-only{display:none!important}
.boot{position:fixed;inset:0;z-index:900;display:grid;place-items:center;background:var(--bg0);color:var(--muted);font-size:15px}

/* ═══════════ Base ═══════════ */
*{box-sizing:border-box}
html,body{margin:0}
body{
  font-family:"DIN Next LT Arabic","Tajawal","Segoe UI",Tahoma,Arial,sans-serif;
  background:var(--bg0);color:var(--ink);line-height:1.6;font-weight:500;min-height:100vh;
  -webkit-print-color-adjust:exact;print-color-adjust:exact;
}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    linear-gradient(var(--grid) 1px,transparent 1px) 0 0/48px 48px,
    linear-gradient(90deg,var(--grid) 1px,transparent 1px) 0 0/48px 48px,
    radial-gradient(900px 500px at 85% -10%,rgba(var(--glowc),.14),transparent 60%),
    radial-gradient(800px 500px at 0% 110%,rgba(94,16,66,.35),transparent 60%);
}
[data-theme=day] body::before{background:
    linear-gradient(var(--grid) 1px,transparent 1px) 0 0/48px 48px,
    linear-gradient(90deg,var(--grid) 1px,transparent 1px) 0 0/48px 48px,
    radial-gradient(900px 500px at 85% -10%,rgba(241,90,62,.08),transparent 60%)}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;background:repeating-linear-gradient(0deg,rgba(255,255,255,.012) 0 1px,transparent 1px 3px)}
[data-theme=day] body::after{display:none}
.num,.orb{font-family:"Orbitron","DIN Next LT Arabic","Tajawal",sans-serif;font-variant-numeric:tabular-nums;letter-spacing:.02em}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
.wrap{position:relative;z-index:1;max-width:1360px;margin:0 auto;padding:20px 24px 60px}

/* Glass panel + corner brackets */
.glass{background:var(--panel);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:18px;position:relative}
.brk::after{content:"";position:absolute;inset:7px;pointer-events:none;opacity:.7;
  background:
    linear-gradient(var(--a1),var(--a1)) top left/16px 2px no-repeat,linear-gradient(var(--a1),var(--a1)) top left/2px 16px no-repeat,
    linear-gradient(var(--a1),var(--a1)) top right/16px 2px no-repeat,linear-gradient(var(--a1),var(--a1)) top right/2px 16px no-repeat,
    linear-gradient(var(--a1),var(--a1)) bottom left/16px 2px no-repeat,linear-gradient(var(--a1),var(--a1)) bottom left/2px 16px no-repeat,
    linear-gradient(var(--a1),var(--a1)) bottom right/16px 2px no-repeat,linear-gradient(var(--a1),var(--a1)) bottom right/2px 16px no-repeat}

/* ═══════════ Header ═══════════ */
header.top{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between;padding:16px 22px;overflow:visible;z-index:100}
.menu{backdrop-filter:none!important;background:var(--solid)!important;opacity:1}
header.top::before{content:"";position:absolute;inset-inline:18px;bottom:-1px;height:2px;background:var(--grad);box-shadow:0 0 14px rgba(var(--glowc),.7);border-radius:2px}
.brand{display:flex;align-items:center;gap:16px}
.logo{height:56px;width:auto;display:block;filter:drop-shadow(0 0 10px rgba(var(--glowc),.25))}
.brand h1{margin:0;font-size:24px;font-weight:800;background:linear-gradient(90deg,var(--ink),var(--a1));-webkit-background-clip:text;background-clip:text;color:transparent}
.brand .sub{color:var(--muted);font-size:13px}
.live{display:inline-flex;align-items:center;gap:6px;font-size:11px;color:var(--ok);margin-inline-start:8px;vertical-align:middle}
.live i{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px var(--ok);animation:blink 1.6s infinite}
@keyframes blink{50%{opacity:.25}}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{display:inline-flex;align-items:center;gap:6px;cursor:pointer;white-space:nowrap;
  background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 13px;font-size:13px;font-weight:700;transition:.2s}
.btn:hover{border-color:var(--a1);color:var(--a1);box-shadow:0 0 14px rgba(var(--glowc),.25)}
.btn.primary{background:var(--grad);color:#fff;border-color:transparent}
.btn.primary:hover{color:#fff;filter:brightness(1.1)}
.btn.on{background:var(--a2);color:#fff;border-color:var(--a2)}
.btn.danger:hover{border-color:var(--bad);color:var(--bad)}
.btn.sm{padding:5px 10px;font-size:12px}
.menu-wrap{position:relative}
.menu{position:absolute;top:calc(100% + 8px);inset-inline-end:0;z-index:60;display:none;min-width:240px;padding:6px;background:var(--solid);border:1px solid var(--line);border-radius:12px;box-shadow:0 18px 40px rgba(0,0,0,.35)}
.menu.open{display:block}
.menu button{display:flex;align-items:center;gap:8px;width:100%;text-align:start;background:none;border:0;padding:9px 12px;border-radius:8px;cursor:pointer;font-size:13px}
.menu button:hover{background:var(--panel2);color:var(--a1)}
.menu hr{border:0;border-top:1px solid var(--line2);margin:4px 0}
.menu .sw{width:16px;height:16px;border-radius:50%;flex-shrink:0;border:1px solid var(--line2)}
.menu .ttl{font-size:11px;color:var(--soft);padding:6px 12px 2px}

/* ═══════════ Tabs ═══════════ */
.tabs{display:flex;gap:8px;margin:18px 0 4px;overflow-x:auto;padding:4px 2px 6px;align-items:center}
.tab{flex-shrink:0;cursor:pointer;border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:9px 18px;font-weight:800;font-size:14px;transition:.2s;text-align:center}
.tab small{display:block;font-size:10px;color:var(--soft);font-weight:500}
.tab:hover{border-color:var(--a1)}
.tab.active{background:var(--grad);color:#fff;border-color:transparent;box-shadow:0 0 18px rgba(var(--glowc),.4)}
.tab.active small{color:rgba(255,255,255,.8)}
.tab.year{border-style:solid}
.tab{position:relative}
.tab-x{position:absolute;top:-8px;inset-inline-start:-8px;width:22px;height:22px;border-radius:50%;background:var(--bad);color:#fff;font-size:11px;display:grid;place-items:center;box-shadow:0 0 10px var(--bad);cursor:pointer;z-index:2}
.tab-x:hover{transform:scale(1.15)}
.tab-rv{position:absolute;top:-8px;inset-inline-end:-6px;width:20px;height:20px;border-radius:50%;background:var(--a1);color:#021;font-size:12px;font-weight:800;display:grid;place-items:center;box-shadow:0 0 10px var(--a1)}
.rv-banner{padding:16px 18px;border-color:var(--a1);background:linear-gradient(135deg,rgba(var(--glowc),.16),var(--panel))}
.rv-list{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.rv-list span{font-size:12px;padding:3px 10px;border-radius:20px;border:1px dashed var(--a1);color:var(--a1)}
.rv-list span.ok{border-style:solid;border-color:var(--ok);color:var(--ok)}
.rv-chip{display:inline-flex;align-items:center;gap:8px;font-size:12px;color:var(--a1);border:1px dashed var(--a1);border-radius:20px;padding:3px 6px 3px 12px;background:rgba(var(--glowc),.08)}
.rv-chip button{border:0;background:var(--a1);color:#021;font-weight:800;border-radius:14px;padding:2px 10px;cursor:pointer;font-size:11px}
.btn.danger-fill{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn.danger-fill:disabled{opacity:.4;cursor:not-allowed;box-shadow:none}
.tab.add{border-style:dashed;color:var(--a1);min-width:64px;border-color:var(--a1)}
.tab.add:hover{background:rgba(var(--glowc),.12);box-shadow:0 0 14px rgba(var(--glowc),.35)}

/* ═══════════ Sections ═══════════ */
.sec{margin-top:28px;animation:rise .45s ease both}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.sec-h{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.sec-h .idx{font-size:12px;color:var(--a1);border:1px solid var(--line);border-radius:8px;padding:2px 8px;background:var(--panel)}
.sec-h h2{margin:0;font-size:23px;font-weight:800}
.sec-h .cnt{font-size:12px;color:var(--muted);background:var(--panel);border:1px solid var(--line2);border-radius:20px;padding:2px 10px}
.sec-h .line{flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}
[dir=rtl] .sec-h .line{background:linear-gradient(-90deg,var(--line),transparent)}
.edit-only{display:none!important}
body.editing .edit-only{display:inline-flex!important}
.grid{display:grid;gap:14px}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media(max-width:1050px){.g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:640px){.g3,.g4,.g2{grid-template-columns:1fr}}
.card{background:var(--panel);backdrop-filter:blur(8px);border:1px solid var(--line2);border-radius:16px;padding:16px 18px;position:relative;transition:transform .2s,box-shadow .2s,border-color .2s;overflow:hidden}
.card::before{content:"";position:absolute;top:0;inset-inline:16px;height:1px;background:linear-gradient(90deg,transparent,rgba(var(--glowc),.8),transparent);opacity:.6}
.card.hov:hover{transform:translateY(-3px);border-color:var(--a1);box-shadow:0 0 0 1px rgba(var(--glowc),.25),0 14px 30px rgba(0,0,0,.25)}
.card h3{margin:0;font-size:16px;font-weight:800}
.card p{margin:8px 0 0;color:var(--muted);font-size:14px;line-height:1.75}
.empty{color:var(--soft);font-size:14px;padding:4px 2px}

/* Entity logo */
.eh{display:flex;align-items:center;gap:12px}
.eh .t{flex:1;min-width:0}
.ent{font-size:12px;color:var(--soft)}
.lg{width:62px;height:62px;border-radius:14px;flex-shrink:0;display:grid;place-items:center;overflow:hidden;
  background:#fff;border:1px solid var(--line);box-shadow:0 0 0 3px rgba(var(--glowc),.06)}
.lg img{width:94%;height:94%;object-fit:contain}
.lg span{font-weight:800;font-size:17px;color:#022537}
.lg.none{background:var(--panel2)}
.lg.none span{color:var(--soft)}
body.editing .lg{cursor:pointer;outline:1px dashed var(--a1);outline-offset:2px}

/* Status */
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.chip{cursor:pointer;border:1px solid var(--line2);background:var(--panel);border-radius:20px;padding:4px 12px;font-size:12px;font-weight:700;display:inline-flex;align-items:center;gap:6px;transition:.2s}
.chip i{width:8px;height:8px;border-radius:50%;display:inline-block;box-shadow:0 0 6px currentColor}
.chip.active{border-color:var(--a1);color:var(--a1);box-shadow:0 0 10px rgba(var(--glowc),.25)}
.badge{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;font-size:12px;font-weight:800;padding:3px 11px;border-radius:20px;
  color:var(--c);background:color-mix(in srgb,var(--c) 16%,transparent);border:1px solid color-mix(in srgb,var(--c) 45%,transparent)}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--c);box-shadow:0 0 6px var(--c)}
.st{cursor:pointer;display:flex;flex-direction:column;gap:8px}
.st .up{font-size:14px;color:var(--muted);line-height:1.75;flex:1}
.prog{display:flex;align-items:center;gap:10px}
.prog .bar{flex:1;height:8px;border-radius:8px;background:var(--panel2);overflow:hidden;border:1px solid var(--line2)}
.prog .bar i{display:block;height:100%;border-radius:8px;background:var(--grad);box-shadow:0 0 10px rgba(var(--glowc),.6);transition:width .8s}
.prog b{font-size:13px;min-width:42px;text-align:end}
.prog.none b{font-family:inherit;color:var(--soft);font-weight:500;font-size:11px}
.grp-h{display:flex;align-items:center;gap:10px;margin:22px 0 12px;font-size:15px}
.grp-h:first-of-type{margin-top:6px}
.grp-h i{width:10px;height:10px;border-radius:50%;background:var(--c);box-shadow:0 0 8px var(--c)}
.grp-h b{color:var(--c);font-weight:800}
.grp-h span.num{font-size:12px;color:var(--muted);border:1px solid var(--line2);border-radius:20px;padding:0 9px;background:var(--panel)}
.grp-h .ln{flex:1;height:2px;border-radius:2px;background:linear-gradient(90deg,var(--c),transparent);opacity:.55}
[dir=rtl] .grp-h .ln{background:linear-gradient(-90deg,var(--c),transparent)}
.chg{font-size:11px;font-weight:700;padding:1px 9px;border-radius:12px;background:var(--panel2);color:var(--muted);border:1px solid var(--line2)}
.chg.new{color:#4cc3e6}.chg.upd{color:var(--a1)}.chg.up{color:var(--ok)}

/* ═══════════ KPI dashboard panel ═══════════ */
.dash{padding:18px;overflow:hidden}
.dash-h{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.dash-h h2{margin:0;font-size:20px;font-weight:800}
.dash-h .sp{flex:1}
.dash-h select{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:12px}
.kgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.kt{background:linear-gradient(160deg,var(--panel2),var(--panel));border:1px solid var(--line2);border-radius:16px;padding:14px 16px 12px;min-height:196px;display:flex;flex-direction:column;position:relative;overflow:hidden;transition:.25s}
.kt::after{content:"";position:absolute;inset-inline-start:0;top:14px;bottom:14px;width:3px;border-radius:3px;background:var(--grad);box-shadow:0 0 12px rgba(var(--glowc),.8)}
.kt:hover{transform:translateY(-3px);border-color:var(--a1);box-shadow:0 0 22px rgba(var(--glowc),.22)}
.kt .kh{display:flex;align-items:center;justify-content:space-between;gap:8px}
.kt .kl{font-size:13px;color:var(--muted);font-weight:700}
.kt .kic{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:rgba(var(--glowc),.12);color:var(--a1);font-size:14px}
.kt .kb{flex:1;display:flex;align-items:center;justify-content:center;padding:6px 0}
.kt .kf{display:flex;align-items:center;justify-content:space-between;gap:6px;font-size:11px;color:var(--soft);min-height:18px}
.kt .kv{font-size:34px;font-weight:800;line-height:1.1;text-shadow:0 0 18px rgba(var(--glowc),.35)}
.kt .ku{font-size:12px;color:var(--muted);margin-top:2px;text-align:center}
.kt .kd{font-size:11px;font-weight:800;padding:2px 8px;border-radius:10px}
.kd.up{color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,transparent)}
.kd.down{color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,transparent)}
.kd.flat{color:var(--muted);background:var(--panel2)}
.kt .ktools{display:none;gap:4px}
body.editing .kt .ktools{display:flex}
.ktools button{border:1px solid var(--line);background:var(--panel2);border-radius:7px;min-width:24px;height:22px;cursor:pointer;font-size:11px;padding:0 6px}
.ktools button:hover{color:var(--a1);border-color:var(--a1)}
.ring-t{font-family:Orbitron,sans-serif;font-weight:800;fill:var(--ink)}
.ring-s{font-size:9px;fill:var(--muted)}
.mini-leg{display:flex;flex-direction:column;gap:3px;font-size:11px;color:var(--muted);min-width:0}
.mini-leg span{display:flex;align-items:center;gap:5px;white-space:nowrap}
.mini-leg i{width:8px;height:8px;border-radius:2px;flex-shrink:0}
.mini-leg b{color:var(--ink);font-family:Orbitron,sans-serif;font-size:11px}

/* ═══════════ Targets (year) ═══════════ */
.tg{display:flex;flex-direction:column;gap:12px}
.tg-h{display:flex;align-items:center;justify-content:space-between;gap:10px}
.tg-h h3{font-size:18px}
.tg-h .type{font-size:12px;color:var(--soft)}
.kv4{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kv4 div{background:var(--panel2);border-radius:10px;padding:8px 10px;border:1px solid var(--line2)}
.kv4 .l{font-size:11px;color:var(--muted);display:block}
.kv4 .v{font-size:16px;font-weight:800;display:block;direction:ltr;text-align:right}
.kv4 .n{font-size:11px;font-weight:700;display:block}
.kv4 .good{border-color:color-mix(in srgb,var(--ok) 45%,transparent)} .kv4 .good .n{color:var(--ok)}
.kv4 .bad{border-color:color-mix(in srgb,var(--bad) 40%,transparent)} .kv4 .bad .n{color:var(--bad)}
.pace{font-size:12px;color:var(--muted);border-top:1px dashed var(--line2);padding-top:8px}
.pace-bar{position:relative;height:9px;border-radius:9px;background:var(--panel2);border:1px solid var(--line2);margin:6px 0 5px}
.pace-bar i{position:absolute;inset-block:0;inset-inline-start:0;border-radius:9px;box-shadow:0 0 10px currentColor}
.pace-bar em{position:absolute;top:-5px;bottom:-5px;width:2px;background:var(--ink);box-shadow:0 0 6px var(--ink)}
.mom{font-size:12px;font-weight:700}
.mom.up{color:var(--ok)}.mom.down{color:var(--bad)}.mom.flat{color:var(--muted)}
.plot{display:flex;align-items:flex-end;gap:6px;height:120px;position:relative;border-bottom:1px solid var(--line2)}
.plot .col{flex:1;height:100%;display:flex;align-items:flex-end;justify-content:center}
.plot .col i{display:block;width:100%;max-width:24px;border-radius:5px 5px 0 0;transition:height .8s}
.plot .tline{position:absolute;inset-inline:0;border-top:2px dashed var(--soft);pointer-events:none}
.plot-l{display:flex;gap:6px;margin-top:4px}
.plot-l span{flex:1;text-align:center;font-size:10px;color:var(--soft)}
.plot-l span.cur{color:var(--a1);font-weight:800}

/* Financial / tenders / tables */
.fl{margin-top:12px;padding-top:10px;border-top:1px dashed var(--line2);display:flex;flex-direction:column;gap:7px}
.fl-r{display:grid;grid-template-columns:auto 1fr 60px auto;align-items:center;gap:8px;font-size:13px}
.fl-n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink)}
.fl-b{height:5px;border-radius:5px;background:var(--panel2);overflow:hidden}
.fl-b i{display:block;height:100%;background:var(--grad);box-shadow:0 0 6px rgba(var(--glowc),.6)}
.fl-r b{font-size:12px;min-width:70px;text-align:end}
.fl-more,.fl-empty{font-size:11px;color:var(--soft);margin-top:8px}
.lg.sm{width:36px;height:36px;border-radius:9px}
.lg.pick{position:relative;cursor:pointer;outline:1px dashed var(--a1);outline-offset:2px}
.lg.pick:hover{box-shadow:0 0 12px rgba(var(--glowc),.5)}
.pick-caret{position:absolute;bottom:-2px;inset-inline-start:-2px;font-style:normal;font-size:9px;background:var(--a1);color:#021;border-radius:6px;padding:0 3px;line-height:14px}
.lpick{position:fixed;z-index:700;width:310px;max-height:370px;display:flex;flex-direction:column;background:var(--solid);border:1px solid var(--a1);border-radius:14px;box-shadow:0 20px 50px rgba(0,0,0,.45),0 0 20px rgba(var(--glowc),.25);overflow:hidden}
.lp-s{margin:10px;background:var(--bg1);border:1px solid var(--line2);border-radius:9px;padding:8px 10px;font-size:14px}
.lp-s:focus{outline:none;border-color:var(--a1)}
.lp-l{flex:1;overflow:auto;padding:0 6px}
.lp-i{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:9px;cursor:pointer;font-size:14px}
.lp-i:hover,.lp-i.on{background:rgba(var(--glowc),.12)}
.lp-i span{flex:1}
.lp-i em{font-style:normal;font-size:10px;color:var(--soft)}
.lp-add{color:var(--a1);font-weight:700}
.lp-f{display:flex;gap:6px;padding:8px 10px;border-top:1px solid var(--line2)}
.lg.sm span{font-size:10px}
.fin .l{font-size:13px;color:var(--muted)}
.fin .v{font-size:23px;font-weight:800;margin-top:4px}
.fin .note{font-size:11px;color:var(--soft);margin-top:2px}
.fin.hero{background:linear-gradient(135deg,rgba(var(--glowc),.22),var(--panel));border-color:var(--a1)}
.fin.hero .v{font-size:30px;text-shadow:0 0 18px rgba(var(--glowc),.4)}
.tbl{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--line2);border-radius:14px;overflow:hidden}
.tbl th,.tbl td{padding:10px 12px;text-align:start;border-bottom:1px solid var(--line2);font-size:14px;vertical-align:middle}
.tbl th{font-size:12px;color:var(--muted);background:var(--panel2)}
.tbl tr:hover td{background:rgba(var(--glowc),.05)}
.tbl .lg{width:44px;height:44px;border-radius:10px}
.tbl .lg span{font-size:12px}
.mx td{text-align:center}.mx td:first-child{text-align:start}
.ch2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:10px}
.ch2 .lbl{font-size:11px;color:var(--soft);display:block}
.ch2 p{margin:2px 0 0}
.auto-tag{font-size:11px;color:var(--soft);border:1px dashed var(--line2);border-radius:10px;padding:1px 8px}
.stack{display:flex;height:22px;border-radius:8px;overflow:hidden;border:1px solid var(--line2);flex:1}
.stack i{display:block;height:100%}
.row-m{display:flex;align-items:center;gap:12px;margin:8px 0}
.row-m b{min-width:70px;font-size:13px}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--muted);margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.mhead{display:flex;align-items:center;gap:10px;margin:18px 0 10px;font-weight:800;color:var(--a1)}
.mhead::after{content:"";flex:1;height:1px;background:var(--line2)}
.hint{font-size:12px;color:var(--muted);margin:0 0 12px;line-height:1.7}

footer.foot{margin-top:40px;padding-top:14px;border-top:1px solid var(--line2);display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;color:var(--soft);font-size:12px;position:relative;z-index:1}

/* ═══════════ Modal ═══════════ */
.ov{position:fixed;inset:0;background:rgba(0,8,14,.65);backdrop-filter:blur(5px);z-index:200;display:flex;align-items:center;justify-content:center;padding:18px}
.md{background:var(--solid);border-radius:18px;width:min(940px,100%);max-height:90vh;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.45);border:1px solid var(--line);overflow:hidden}
.md-h{display:flex;align-items:center;justify-content:space-between;padding:15px 20px;border-bottom:1px solid var(--line2);position:relative}
.md-h::after{content:"";position:absolute;inset-inline:0;top:0;height:3px;background:var(--grad)}
.md-h h3{margin:0;font-size:18px}
.md-b{padding:16px 20px;overflow:auto}
.md-f{display:flex;gap:8px;justify-content:flex-end;padding:12px 20px;border-top:1px solid var(--line2)}
.x{background:none;border:0;font-size:22px;cursor:pointer;color:var(--muted)}
.frow{display:grid;gap:8px;align-items:start;padding:10px;border:1px solid var(--line2);border-radius:12px;margin-bottom:8px;background:var(--panel2)}
.frow input,.frow select,.frow textarea,.fld input,.fld select,.fld textarea{width:100%;background:var(--bg1);border:1px solid var(--line2);border-radius:8px;padding:8px 10px;font-size:14px}
.frow textarea,.fld textarea{min-height:58px;resize:vertical;line-height:1.6}
.frow input:focus,.frow select:focus,.frow textarea:focus,.fld input:focus,.fld select:focus{outline:none;border-color:var(--a1)}
.fld{margin-bottom:12px}
.fld label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px;font-weight:700}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ic{display:flex;gap:4px}
.ic button{border:1px solid var(--line2);background:var(--bg1);border-radius:8px;width:30px;height:30px;cursor:pointer}
.ic button:hover{border-color:var(--a1);color:var(--a1)}
.ic .drag{display:grid;place-items:center;width:30px;height:30px;border-radius:8px;border:1px solid var(--line2);background:var(--bg1);cursor:grab;font-size:16px;color:var(--muted);touch-action:none;user-select:none}
.ic .drag:hover{border-color:var(--a1);color:var(--a1)}
.frow.dragging{cursor:grabbing;opacity:.95;box-shadow:0 18px 40px rgba(0,0,0,.45),0 0 0 2px var(--a1);background:var(--solid);pointer-events:none}
.frow-ph{border:2px dashed var(--a1);border-radius:12px;margin-bottom:8px;background:rgba(var(--glowc),.07)}
.frow.dropped{animation:dropflash .5s ease}
@keyframes dropflash{from{box-shadow:0 0 0 2px var(--a1),0 0 18px rgba(var(--glowc),.5)}to{box-shadow:none}}
.ltr{direction:ltr;text-align:right}
.mgrid{width:100%;border-collapse:collapse}
.mgrid th,.mgrid td{border:1px solid var(--line2);padding:4px;font-size:12px;text-align:center}
.mgrid input{width:100%;border:0;background:transparent;padding:5px;text-align:center;direction:ltr}
.mgrid input:focus{outline:2px solid var(--a1)}
.lgrow{display:flex;align-items:center;gap:12px;padding:8px 10px;border:1px solid var(--line2);border-radius:12px;margin-bottom:6px;background:var(--panel2)}
.lgrow .n{flex:1}

.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);opacity:0;background:var(--grad);color:#fff;padding:10px 18px;border-radius:12px;font-size:14px;z-index:500;transition:.3s;pointer-events:none;font-weight:700}
.toast.show{opacity:1;transform:translateX(-50%)}

/* ═══════════ TV ═══════════ */
.tv{position:fixed;inset:0;z-index:400;background:var(--bg0);display:none;flex-direction:column}
.tv::before{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(var(--grid) 1px,transparent 1px) 0 0/48px 48px,linear-gradient(90deg,var(--grid) 1px,transparent 1px) 0 0/48px 48px,radial-gradient(900px 500px at 85% -10%,rgba(var(--glowc),.16),transparent 60%)}
body.tvmode .tv{display:flex}
body.tvmode{overflow:hidden}
body.tvmode .edit-only,body.tvmode .ktools{display:none!important}
.tv-top{display:flex;align-items:center;justify-content:space-between;padding:1.4vh 3vw;position:relative;border-bottom:1px solid var(--line)}
.tv-top::after{content:"";position:absolute;inset-inline:0;bottom:-1px;height:2px;background:var(--grad);box-shadow:0 0 14px rgba(var(--glowc),.7)}
.tv-top .logo{height:6vh}
.tv-top .tt{font-size:clamp(16px,2vw,30px);font-weight:800}
.tv-top .mm{font-size:clamp(13px,1.3vw,20px);color:var(--a1)}
.tv-stage{flex:1;position:relative;overflow:hidden}
.tv-slide{position:absolute;inset:0;padding:2.5vh 3vw;opacity:0;transition:opacity .7s,transform .7s;transform:scale(.97);pointer-events:none}
.tv-slide.on{opacity:1;transform:none;pointer-events:auto}
.tv-fit{transform-origin:top center;width:100%}
.tv-slide .sec{margin-top:0;animation:none}
.tv-cover{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:2.5vh}
.tv-cover .logo{height:18vh}
.tv-cover h1{font-size:clamp(34px,5vw,84px);margin:0;font-weight:800;background:linear-gradient(90deg,var(--ink),var(--a1));-webkit-background-clip:text;background-clip:text;color:transparent}
.tv-cover .m{font-size:clamp(18px,2.4vw,40px);color:var(--a1);font-weight:800}
.tv-ctl{display:flex;align-items:center;justify-content:center;gap:10px;padding:1.1vh;border-top:1px solid var(--line2);position:relative}
.tv-ctl .dots{display:flex;gap:6px}
.tv-ctl .dots i{width:9px;height:9px;border-radius:9px;background:var(--line);cursor:pointer;transition:.3s}
.tv-ctl .dots i.on{width:28px;background:var(--a1);box-shadow:0 0 8px var(--a1)}
.tv-prog{height:3px;background:var(--grad);width:0;box-shadow:0 0 8px rgba(var(--glowc),.8)}

/* ═══════════ Print ═══════════ */
@media print{
  @page{size:A4;margin:10mm}
  body::after{display:none}
  .tools,.tabs,.edit-only,.chips,.toast,.tv,.no-print,.ktools{display:none!important}
  .sec{animation:none}
  .card,.kt{break-inside:avoid}
  .sec-h{break-after:avoid}
  .card.hov:hover,.kt:hover{transform:none}
}
</style>
</head>

</div>

function load(){
  let d = null;
  try { d = JSON.parse(localStorage.getItem(STORE_KEY)); } catch(e){}
  if (!d || !d.reports) d = defaults();
  return migrate(d);
}
function migrate(d){
  if ((d.version||0) < 3) d.kpi = null;
  if ((d.version||0) < 4) {
    const known = new Set(Object.keys(d.logos||{}));
    (d.initiatives||[]).forEach(i=>i.entity&&known.add(i.entity));
    Object.values(d.reports||{}).forEach(r=>{ (r.works||[]).forEach(w=>w.entity&&known.add(w.entity)); (r.tenders||[]).forEach(t=>t.client&&known.add(t.client)); });
    Object.values(d.reports||{}).forEach(r=>{ const f=r.financial||{}; ['received','invoiced','awaiting'].forEach(k=>(Array.isArray(f[k])?f[k]:[]).forEach(x=>{
      if (x.item==null){ if (x.entity && !known.has(x.entity)) { x.item=x.entity; x.entity=''; } else x.item=''; } })); });
    const titles = new Set(); (d.initiatives||[]).forEach(i=>titles.add(i.name)); Object.values(d.reports||{}).forEach(r=>{ (r.works||[]).forEach(w=>titles.add(w.title)); (r.tenders||[]).forEach(t=>titles.add(t.name)); });
    d.entities = (d.entities||[]).filter(n=> (d.logos||{})[n] || !titles.has(n));
  }
  d.version = 4; d.logos = d.logos || {}; d.entities = d.entities || [];
  d.customStatuses = d.customStatuses || []; registerCustomStatuses(d.customStatuses);
  if (!d.preparedBy || d.preparedBy==='مقبل المقبل') d.preparedBy = 'قطاع حلول الأعمال';
  Object.values(d.reports).forEach(r=>{
    (r.tenders||[]).forEach(t=>{ if (t.kind==='previous') t.kind='active'; if (t.kind==='new') t.kind='awarded'; });
    (r.works||[]).forEach(w=>{ if (w.entity==null) w.entity=''; });
    r.financial = r.financial || {};
    ['received','invoiced','awaiting'].forEach(k=>{ const v=r.financial[k];
      if (!Array.isArray(v)) r.financial[k] = (typeof v==='number') ? [{entity:'غير محدّد', amount:v}] : []; });
  });
  if (!d.kpi) d.kpi = {};
  ['month','year'].forEach(sc=>{
    const cur = d.kpi[sc] || KPI_DEFAULT_ON[sc].map(id=>({id, variant:null, hidden:false}));
    KPI_DEFS[sc].forEach(def=>{ if (!cur.find(x=>x.id===def.id)) cur.push({id:def.id, variant:null, hidden:true}); });
    d.kpi[sc] = cur.filter(x=>KPI_DEFS[sc].find(def=>def.id===x.id));
  });
  return d;
}

const $ = s => document.querySelector(s);
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmt(n,d=0){ if (n==null||n===''||isNaN(n)) return '—'; return new Intl.NumberFormat('en-US',{maximumFractionDigits:d}).format(n); }
function compact(n){ if (n==null||isNaN(n)) return '—'; const a=Math.abs(n); if (a>=1e6) return fmt(n/1e6,2)+'M'; if (a>=1e4) return fmt(n/1e3,1)+'K'; return fmt(n); }
function pct(x,d=0){ return (x==null||!isFinite(x)) ? '—' : fmt(x*100,d)+'%'; }
function num(v){ if (v===''||v==null) return null; const n=parseFloat(String(v).replace(/,/g,'')); return isNaN(n)?null:n; }
function sum(list){ return list.reduce((s,x)=>s+(x.value||0),0); }
function toast(t){ const el=$('#toast'); el.textContent=t; el.classList.add('show'); clearTimeout(el._t); el._t=setTimeout(()=>el.classList.remove('show'),2200); }
function reportMonths(){ return Object.keys(S.reports).map(Number).sort((a,b)=>a-b); }
function lastMonth(){ const m=reportMonths(); return m.length?m[m.length-1]:null; }
function prevReportMonth(m){ const ms=reportMonths().filter(x=>x<m); return ms.length?ms[ms.length-1]:null; }
function ini(iid){ return S.initiatives.find(x=>x.id===iid) || {name:'—',entity:''}; }
function tgt(id){ return S.targets.find(t=>t.id===id); }
function ach(m,tid){ const a=S.achievements[String(m)]; return a && a[tid]!=null ? a[tid] : 0; }
function cum(m,tid){ let s=0; for(let k=1;k<=m;k++) s+=ach(k,tid); return s; }
function mSeries(tid,m){ return MONTHS.slice(0,m).map((_,i)=>({l:i+1,v:ach(i+1,tid)})); }
function statusBadge(st){ const d=STATUSES[st]||STATUSES.active; return `<span class="badge" style="--c:${d.c}">${d.l}</span>`; }
function statusParts(r){ const c={}; r.statuses.forEach(s=>c[s.status]=(c[s.status]||0)+1); return Object.keys(STATUSES).filter(k=>c[k]).map(k=>({l:STATUSES[k].l,v:c[k],c:STATUSES[k].c})); }
function allTenders(){ return reportMonths().flatMap(m=>(S.reports[m].tenders||[]).map(t=>({...t,m}))); }
function deltaOf(v,prev,name){
  if (prev==null || v==null) return null;
  if (prev===0 && v===0) return {t:`= ${name||'السابق'}`, cls:'flat'};
  if (prev===0) return {t:`▲ جديد مقابل 0 في ${name}`, cls:'up'};
  const d=(v-prev)/prev; return {t:`${d>0?'▲ +':(d<0?'▼ ':'● ')}${fmt(d*100,1)}% عن ${name}`, cls:d>0?'up':(d<0?'down':'flat')};
}
function tgtKpi(tid,c){
  const t=tgt(tid); if(!t) return {v:null};
  const v=cum(c.m,tid); const pace=c.m/12, p=t.annual?v/t.annual:0;
  return { v, max:t.annual, money:!!t.money, unit:`من ${t.money?compact(t.annual):fmt(t.annual)}${t.money?' ريال':''} · المتوقّع ${pct(pace)}`, series:mSeries(tid,c.m),
    delta:{t:`${p>=pace?'▲ متقدّم':'▼ متأخّر'} ${fmt(Math.abs(p-pace)*100,1)} نقطة`, cls:p>=pace?'up':'down'} };
}
function initials(s){ s=String(s||'').replace(/^(ال)/,'').trim(); const w=s.split(/\s+/).filter(Boolean); if(!w.length) return '؟'; return (w[0][0]+(w[1]?w[1].replace(/^ال/,'')[0]:'')); }
function logoBox(key, cls='', fb=''){

function kpiPanel(scope, ctx, title, idx='00'){
  const cfg = S.kpi[scope];

  const hidden = cfg.filter(x=>x.hidden);

  }).join('');

  return `<section class="sec"><div class="dash glass brk">
    <div class="dash-h"><span class="idx num" style="font-size:12px;color:var(--a1);border:1px solid var(--line);border-radius:8px;padding:2px 8px">${idx}</span><h2>${title}</h2>${scope==='month'?reviewChip(ctx.m,'numbers'):''}<span class="sp"></span>${addSel}${monthBtn}</div>
    <div class="kgrid">${tiles || '<div class="empty">لا توجد مؤشرات ظاهرة — فعّل وضع التحرير لإضافتها</div>'}</div>
  </div></section>`;
}
function kpiTile(scope, def, d, variant, i, n){
  let body;
  const hasMax = d.max!=null && d.max>0 && d.v!=null;
  const hasSeries = d.series && d.series.length>1;
  const hasParts = d.parts && d.parts.length;
  let vv = variant;
  if ((vv==='ring'||vv==='arc') && !hasMax) vv='number';
  if ((vv==='bars'||vv==='spark') && !hasSeries) vv='number';
  if (vv==='donut' && !hasParts) vv='number';
  const valTxt = d.v==null ? '—' : (d.money ? compact(d.v) : fmt(d.v)) + (d.pct?'%':'');
  const color = d.warn ? 'var(--a1)' : 'url(#gOne)';
  if (vv==='number') body = `<div style="text-align:center"><div class="kv num" ${d.v!=null?`data-count="${d.v}" data-money="${d.money?1:0}" data-pct="${d.pct?1:0}"`:''}>${valTxt}</div><div class="ku">${esc(d.unit||'')}</div>${d.sub?`<div class="ku" style="color:var(--a1)">${esc(d.sub)}</div>`:''}</div>`;
  else if (vv==='ring') body = `<div style="display:flex;align-items:center;gap:12px">${svgRing(d.v/d.max, color, 104, valTxt)}<div class="ku" style="text-align:start;max-width:110px">${esc(d.unit||'')}</div></div>`;
  else if (vv==='arc') body = `<div style="text-align:center">${svgArc(d.v/d.max, color, valTxt)}<div class="ku">${esc(d.unit||'')}</div></div>`;
  else if (vv==='bars') body = `<div style="width:100%">${svgBars(d.series)}<div style="display:flex;justify-content:space-between;align-items:baseline;margin-top:6px"><span class="kv num" style="font-size:24px">${valTxt}</span><span class="ku">${esc(d.unit||'')}</span></div></div>`;
  else if (vv==='spark') body = `<div style="width:100%">${svgSpark(d.series)}<div style="display:flex;justify-content:space-between;align-items:baseline;margin-top:6px"><span class="kv num" style="font-size:24px">${valTxt}</span><span class="ku">${esc(d.unit||'')}</span></div></div>`;
  else if (vv==='donut') body = `<div style="display:flex;align-items:center;gap:12px;width:100%">${svgDonut(d.parts, valTxt)}<div class="mini-leg">${d.parts.slice(0,5).map(p=>`<span><i style="background:${p.c}"></i>${esc(p.l)} <b>${p.v}</b></span>`).join('')}</div></div>`;
  const cyc = def.vars.length>1 ? `<button onclick="kpiCycle('${scope}','${def.id}')" title="تغيير النمط">◇ ${VARIANTS[vv]||vv}</button>` : '';
  return `<div class="kt">
    <div class="kh"><span class="kl">${esc(def.l)}</span><span class="kic">${def.ic}</span></div>
    <div class="kb">${body}</div>
    <div class="kf"><span>${d.delta?`<span class="kd ${d.delta.cls}">${esc(d.delta.t)}</span>`:''}</span>
      <span class="ktools">${cyc}${i>0?`<button onclick="kpiMove('${scope}','${def.id}',-1)" title="تقديم">→</button>`:''}${i<n-1?`<button onclick="kpiMove('${scope}','${def.id}',1)" title="تأخير">←</button>`:''}<button onclick="kpiHide('${scope}','${def.id}')" title="إخفاء">✕</button></span></div>
  </div>`;
}
function svgRing(p, color, size, label){
  p = Math.max(0, Math.min(1, p||0)); const r=size/2-10, c=2*Math.PI*r;
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" style="flex-shrink:0;filter:drop-shadow(0 0 6px rgba(var(--glowc),.45))">
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--line2)" stroke-width="10"/>
    <circle cx="${size/2}" cy="${size/2}" r="${r+7}" fill="none" stroke="var(--line2)" stroke-width="1" stroke-dasharray="2 5"/>
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${color}" stroke-width="10" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c}" transform="rotate(-90 ${size/2} ${size/2})"><animate attributeName="stroke-dashoffset" from="${c}" to="${c*(1-p)}" dur="1s" fill="freeze" calcMode="spline" keySplines=".2 .8 .2 1" keyTimes="0;1"/></circle>
    <text x="50%" y="${label?'46%':'50%'}" dominant-baseline="central" text-anchor="middle" class="ring-t" font-size="${size>100?18:15}">${pct(p)}</text>
    ${label?`<text x="50%" y="66%" dominant-baseline="central" text-anchor="middle" class="ring-s">${esc(label)}</text>`:''}</svg>`;
}
function svgArc(p, color, label){
  p = Math.max(0, Math.min(1, p||0)); const W=170,H=100,cx=85,cy=88,r=68, len=Math.PI*r;
  const ang = Math.PI*(1-p), nx=cx+Math.cos(ang)*(r), ny=cy-Math.sin(ang)*(r);
  const ticks = Array.from({length:11},(_,k)=>{const a=Math.PI*(1-k/10);return `<line x1="${cx+Math.cos(a)*(r-16)}" y1="${cy-Math.sin(a)*(r-16)}" x2="${cx+Math.cos(a)*(r-11)}" y2="${cy-Math.sin(a)*(r-11)}" stroke="var(--soft)" stroke-width="${k%5?1:2}"/>`;}).join('');
  return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" style="filter:drop-shadow(0 0 6px rgba(var(--glowc),.45))">
    <path d="M ${cx-r} ${cy} A ${r} ${r} 0 0 1 ${cx+r} ${cy}" fill="none" stroke="var(--line2)" stroke-width="11" stroke-linecap="round"/>
    <path d="M ${cx-r} ${cy} A ${r} ${r} 0 0 1 ${cx+r} ${cy}" fill="none" stroke="${color}" stroke-width="11" stroke-linecap="round" stroke-dasharray="${len}" stroke-dashoffset="${len}"><animate attributeName="stroke-dashoffset" from="${len}" to="${len*(1-p)}" dur="1s" fill="freeze"/></path>
    ${ticks}<circle cx="${nx}" cy="${ny}" r="5" fill="var(--ink)"/>
    <text x="${cx}" y="${cy-18}" text-anchor="middle" class="ring-t" font-size="20">${pct(p)}</text>
    <text x="${cx}" y="${cy-2}" text-anchor="middle" class="ring-s" font-size="10">${esc(label)}</text></svg>`;
}
function svgBars(series){
  const W=200,H=78, n=series.length, max=Math.max(...series.map(s=>s.v),1), bw=Math.max(4,(W-(n-1)*4)/n);
  return `<svg width="100%" height="${H}" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">${series.map((s,i)=>{const h=Math.max(s.v?3:1,(s.v/max)*(H-14));const x=i*(bw+4);
    return `<rect x="${x}" y="${H-12-h}" width="${bw}" height="${h}" rx="2" fill="${i===n-1?'url(#gOne)':'var(--line)'}"><title>${s.l}: ${fmt(s.v)}</title></rect><text x="${x+bw/2}" y="${H-2}" text-anchor="middle" font-size="8" fill="var(--soft)">${s.l}</text>`;}).join('')}</svg>`;
}
function svgSpark(series){
  const W=200,H=70, n=series.length, max=Math.max(...series.map(s=>s.v),1), min=0;
  const pts = series.map((s,i)=>[i*(W/(n-1)), H-6-((s.v-min)/(max-min||1))*(H-14)]);
  const d = pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
  const last = pts[pts.length-1];
  return `<svg width="100%" height="${H}" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><path d="${d} L ${W},${H} L 0,${H} Z" fill="url(#gFill)"/><path d="${d}" fill="none" stroke="var(--a1)" stroke-width="2" style="filter:drop-shadow(0 0 4px var(--a1))"/><circle cx="${last[0]}" cy="${last[1]}" r="3.5" fill="var(--a1)"/></svg>`;
}
function svgDonut(parts, label){
  const size=100, r=38, c=2*Math.PI*r, tot=parts.reduce((a,b)=>a+b.v,0)||1; let off=0;
  const segs = parts.map(p=>{const len=p.v/tot*c; const s=`<circle cx="50" cy="50" r="${r}" fill="none" stroke="${p.c}" stroke-width="13" stroke-dasharray="${Math.max(len-2,0)} ${c}" stroke-dashoffset="${-off}" transform="rotate(-90 50 50)"><title>${p.l}: ${p.v}</title></circle>`; off+=len; return s;}).join('');
  return `<svg width="${size}" height="${size}" viewBox="0 0 100 100" style="flex-shrink:0;filter:drop-shadow(0 0 6px rgba(var(--glowc),.35))"><circle cx="50" cy="50" r="${r}" fill="none" stroke="var(--line2)" stroke-width="13"/>${segs}<text x="50" y="50" dominant-baseline="central" text-anchor="middle" class="ring-t" font-size="20">${esc(label)}</text></svg>`;
}
function countUp(root){
  root.querySelectorAll('[data-count]').forEach(el=>{
    const to=parseFloat(el.dataset.count), money=el.dataset.money==='1', p=el.dataset.pct==='1'; if(!isFinite(to)) return;
    const t0=performance.now(), dur=900;
    const step=now=>{ const k=Math.min(1,(now-t0)/dur), e=1-Math.pow(1-k,3), v=to*e;
      el.textContent=(money?compact(v):fmt(k<1?Math.round(v):to))+(p?'%':''); if(k<1) requestAnimationFrame(step); };
    requestAnimationFrame(step);
  });
}
function kpiCycle(sc,id){ const c=S.kpi[sc].find(x=>x.id===id), def=KPI_DEFS[sc].find(d=>d.id===id); const cur=def.vars.includes(c.variant)?c.variant:def.def; c.variant=def.vars[(def.vars.indexOf(cur)+1)%def.vars.length]; save(); render(); }
function kpiHide(sc,id){ S.kpi[sc].find(x=>x.id===id).hidden=true; save(); render(); }
function kpiShow(sc,id){ if(!id) return; const c=S.kpi[sc].find(x=>x.id===id); c.hidden=false; const arr=S.kpi[sc]; arr.splice(arr.indexOf(c),1); const lastShown=arr.map(x=>!x.hidden).lastIndexOf(true); arr.splice(lastShown+1,0,c); save(); render(); }
function kpiMove(sc,id,d){ const arr=S.kpi[sc]; const shown=arr.filter(x=>!x.hidden); const i=shown.findIndex(x=>x.id===id), j=i+d; if(j<0||j>=shown.length) return;
  const a=arr.indexOf(shown[i]), b=arr.indexOf(shown[j]); [arr[a],arr[b]]=[arr[b],arr[a]]; save(); render(); }

function changeTag(m,s){
  const pm = prevReportMonth(m); if (!pm) return '';
  const p = S.reports[pm].statuses.find(x=>x.iid===s.iid);
  if (!p) return `<span class="chg new">جديد هذا الشهر</span>`;
  if (p.status!==s.status) return `<span class="chg upd">كانت «${STATUSES[p.status]?.l||''}»</span>`;
  if (s.progress!=null && p.progress!=null && s.progress!==p.progress){ const d=s.progress-p.progress; return `<span class="chg ${d>0?'up':'upd'}">${d>0?'▲ +':'▼ '}${d} نقطة</span>`; }

  return `<span class="chg">بدون تغيير</span>`;
}

function finList(r,k){ const f=(r&&r.financial)||{}; return Array.isArray(f[k])?f[k]:[]; }

function finMiniList(list, max=5){

// Load an image, trim empty (transparent/white) margins, scale to max 260px → PNG dataURL
function trimLogo(src, cb){
  const img=new Image();
  img.onload=()=>{ try{
    const s0=Math.min(1,600/Math.max(img.width,img.height)), W=Math.max(1,Math.round(img.width*s0)), H=Math.max(1,Math.round(img.height*s0));
    const c=document.createElement('canvas'); c.width=W; c.height=H; const g=c.getContext('2d'); g.drawImage(img,0,0,W,H);
    const d=g.getImageData(0,0,W,H).data; let x0=W,y0=H,x1=-1,y1=-1;
    for(let y=0;y<H;y++) for(let x=0;x<W;x++){ const k=(y*W+x)*4, a=d[k+3]; if(a<16) continue; if(d[k]>242&&d[k+1]>242&&d[k+2]>242) continue; if(x<x0)x0=x; if(x>x1)x1=x; if(y<y0)y0=y; if(y>y1)y1=y; }
    if (x1<0){ cb(src); return; }
    const pad=Math.round(Math.max(x1-x0,y1-y0)*0.04); x0=Math.max(0,x0-pad); y0=Math.max(0,y0-pad); x1=Math.min(W-1,x1+pad); y1=Math.min(H-1,y1+pad);
    const cw=x1-x0+1, ch=y1-y0+1, s1=Math.min(1,260/Math.max(cw,ch));
    const o=document.createElement('canvas'); o.width=Math.max(1,Math.round(cw*s1)); o.height=Math.max(1,Math.round(ch*s1));
    o.getContext('2d').drawImage(c,x0,y0,cw,ch,0,0,o.width,o.height); cb(o.toDataURL('image/png'));
  }catch(e){ cb(src); } };
  img.onerror=()=>cb(src); img.src=src;
}
function readLogo(file, cb){ const fr=new FileReader(); fr.onload=()=>trimLogo(fr.result, cb); fr.readAsDataURL(file); }

  let left=keys.length; keys.forEach(k=>trimLogo(S.logos[k], url=>{ S.logos[k]=url; if(--left===0){ S.logosTrimmed=true; save(); render(); } }));

// Drag & drop reordering for editor rows (pointer events: mouse + touch)
document.addEventListener('pointerdown', e=>{
  const hd=e.target.closest('.frow .drag'); if(!hd) return;
  e.preventDefault();
  const row=hd.closest('.frow'), list=row.parentNode, r=row.getBoundingClientRect(), orig=row.getAttribute('style')||'';
  const ph=document.createElement('div'); ph.className='frow-ph'; ph.style.height=r.height+'px';
  list.insertBefore(ph,row);
  row.classList.add('dragging');
  row.setAttribute('style', orig+`;position:fixed;left:${r.left}px;top:${r.top}px;width:${r.width}px;z-index:800;margin:0`);
  const offY=e.clientY-r.top, sc=list.closest('.md-b');
  const move=ev=>{
    row.style.top=(ev.clientY-offY)+'px';
    const sibs=[...list.children].filter(c=>c.classList.contains('frow') && c!==row);
    let placed=false;
    for(const s of sibs){ const b=s.getBoundingClientRect(); if(ev.clientY < b.top+b.height/2){ if(ph.nextSibling!==s) list.insertBefore(ph,s); placed=true; break; } }
    if(!placed && list.lastElementChild!==ph) list.appendChild(ph);
    if(sc){ const sb=sc.getBoundingClientRect(); if(ev.clientY<sb.top+50) sc.scrollTop-=14; else if(ev.clientY>sb.bottom-50) sc.scrollTop+=14; }
  };
  const up=()=>{
    document.removeEventListener('pointermove',move); document.removeEventListener('pointerup',up); document.removeEventListener('pointercancel',up);
    list.insertBefore(row,ph); ph.remove(); row.classList.remove('dragging'); row.setAttribute('style',orig);
    row.classList.add('dropped'); setTimeout(()=>row.classList.remove('dropped'),500);
    list.dispatchEvent(new Event('input',{bubbles:true}));
  };
  document.addEventListener('pointermove',move); document.addEventListener('pointerup',up); document.addEventListener('pointercancel',up);
});

function needsReview(m,k){ const r=S.reports[m]; return !!(r && r.review && r.review[k]===false); }
function reviewChip(m,k){ if(!needsReview(m,k)) return ''; const r=S.reports[m];

function markReviewed(m,k,rerender){ const r=S.reports[m]; if(r&&r.review){ r.review[k]=true; if(Object.values(r.review).every(Boolean)) delete r.review; } if(rerender){ save(); render(); toast(`تمت مراجعة «${REVIEW_LABELS[k]}» ✓`); } }

  const src = last ? JSON.parse(JSON.stringify(S.reports[last])) : {works:[],statuses:[],financial:{},tenders:[],challenges:[]};
  delete src.review; delete src.copiedFrom;
  S.reports[next] = last ? {...src, copiedFrom:last, review:{works:false,statuses:false,financial:false,tenders:false,challenges:false,numbers:false}} : src;
  S.achievements[String(next)] = last ? {...(S.achievements[String(last)]||{})} : (S.achievements[String(next)]||{});
  save(); location.hash='m-'+next; if(!editing) toggleEdit(); else render(); toast(`تم إنشاء تقرير ${MONTHS[next-1]} منسوخاً من ${last?MONTHS[last-1]:'—'} — راجع الأقسام`);

// ═══════════ TV mode ═══════════
let tv={i:0,n:0,timer:null,playing:true,dur:12000};
function startTV(){
  const v=currentView(); const wasEd=editing; editing=false;
  let slides=[], label='';
  if (v==='year'){ const lm=lastMonth()||1; label=`ملخّص سنة ${S.year}`; slides=[cover(label), ...yearSections()]; }
  else { const m=v, r=S.reports[m]; label=`تقرير ${MONTHS[m-1]} ${S.year}`; const pm=prevReportMonth(m);
    slides=[cover(label), secWorks(m,r,'01')];
    { const srt=[...r.statuses].sort((x,y)=>STATUS_ORDER.indexOf(x.status)-STATUS_ORDER.indexOf(y.status)); for(let k=0;k<srt.length;k+=6) slides.push(secStatus(m,{...r,statuses:srt.slice(k,k+6)},'02',true)); }
    slides.push(secFinancial(m,r,'03'), secTenders(m,r,'04'), secChallenges(m,r,'05'), kpiPanel('month',{m,r,pm,pr:pm?S.reports[pm]:null},`لوحة مؤشرات ${MONTHS[m-1]}`,'06')); }
  editing=wasEd;
  $('#tvLogo').innerHTML=LOGO; $('#tvMonth').textContent=label;
  $('#tvStage').innerHTML=slides.map(s=>`<div class="tv-slide"><div class="tv-fit">${s}</div></div>`).join('');
  $('#tvDots').innerHTML=slides.map((_,i)=>`<i onclick="tvShow(${i})"></i>`).join('');
  tv.n=slides.length; tv.playing=true; $('#tvPlay').textContent='⏸ إيقاف';
  document.body.classList.add('tvmode'); document.documentElement.requestFullscreen?.().catch(()=>{});
  tvShow(0);
}
function cover(label){ return `<div class="tv-cover">${LOGO}<h1>التقرير الشهري</h1><div class="m">${label}</div><div style="color:var(--muted)">مُعدّ لـ${esc(S.audience)} · ${esc(S.preparedBy)}</div></div>`; }
function tvFit(el){ const f=el.querySelector('.tv-fit'); f.style.transform='none'; const H=el.clientHeight-10, W=el.clientWidth-10; const sc=Math.min(1.45, H/f.scrollHeight, W/f.scrollWidth); f.style.transform=`scale(${sc})`; }
function tvShow(i){
  tv.i=((i%tv.n)+tv.n)%tv.n;
  document.querySelectorAll('.tv-slide').forEach((s,k)=>{ s.classList.toggle('on',k===tv.i); if(k===tv.i){ tvFit(s); countUp(s); } });
  document.querySelectorAll('#tvDots i').forEach((d,k)=>d.classList.toggle('on',k===tv.i));
  const p=$('#tvProg'); p.style.transition='none'; p.style.width='0'; clearTimeout(tv.timer);
  if (tv.playing){ requestAnimationFrame(()=>requestAnimationFrame(()=>{ p.style.transition=`width ${tv.dur}ms linear`; p.style.width='100%'; })); tv.timer=setTimeout(()=>tvShow(tv.i+1),tv.dur); }
}
function tvToggle(){ tv.playing=!tv.playing; $('#tvPlay').textContent=tv.playing?'⏸ إيقاف':'▶ تشغيل'; tvShow(tv.i); }
function stopTV(){ clearTimeout(tv.timer); document.body.classList.remove('tvmode'); if(document.fullscreenElement) document.exitFullscreen().catch(()=>{}); }
document.addEventListener('keydown', e=>{ if(!document.body.classList.contains('tvmode')) return;
  if(e.key==='Escape') stopTV(); if(e.key==='ArrowLeft') tvShow(tv.i+1); if(e.key==='ArrowRight') tvShow(tv.i-1); if(e.key===' '){ e.preventDefault(); tvToggle(); } });
window.addEventListener('resize', ()=>{ const s=document.querySelector('.tv-slide.on'); if(s) tvFit(s); });

function exportPublish(){
  closeMenu(); const d=JSON.parse(JSON.stringify(S)); d.publishedAt=new Date().toISOString();
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([JSON.stringify(d)],{type:'application/json'})); a.download='data.json'; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),500);
  toast('تم تصدير data.json — ارفعه على المستودع ليتحدّث الرابط المنشور');
}
async function boot(){
  if (!HOSTED){ render(); trimExistingLogos(); return; }
  if (VIEWER) document.body.classList.add('viewer');
  const hasLocal = !!localStorage.getItem(STORE_KEY);
  if (VIEWER || !hasLocal){
    const b=document.createElement('div'); b.className='boot'; b.textContent='جارِ تحميل التقرير…'; document.body.appendChild(b);
    try{
      const res=await fetch('data.json?v='+Date.now(),{cache:'no-store'}); if(!res.ok) throw 0;
      S = migrate(await res.json()); b.remove();
    }catch(e){ b.textContent='تعذّر تحميل بيانات التقرير (data.json).'; return; }
    if (!VIEWER) save();
  }
  render(); if(!VIEWER) trimExistingLogos();
}
boot();
</script>
